<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<!-- Kilde til site/deling.png (delingsbilledet på Reddit, Facebook osv.).
     Lav det igen med: python3 scripts/lav_billeder.py -->
<style>
@font-face { font-family: 'Archivo'; src: url('../site/fonts/archivo-latin-wdth-normal.woff2') format('woff2'); font-weight: 100 900; font-stretch: 62% 125%; }
@font-face { font-family: 'Plex Mono'; src: url('../site/fonts/ibm-plex-mono-latin-600-normal.woff2') format('woff2'); font-weight: 600; }
html, body { margin: 0; }
.kort {
  width: 1200px; height: 630px; box-sizing: border-box;
  background: #E8EDEF; color: #0D1B24;
  font-family: 'Archivo', sans-serif;
  padding: 56px 64px;
  display: grid; grid-template-columns: 1fr 360px; gap: 48px;
}
.venstre { display: flex; flex-direction: column; }
.domaene { font-family: 'Plex Mono', monospace; font-weight: 600; font-size: 24px; padding-bottom: 18px; border-bottom: 3px solid #0D1B24; }
.spoergsmaal { margin-top: 34px; font-size: 50px; font-weight: 700; line-height: 1.15; }
.spoergsmaal span { border-bottom: 7px solid #FFD400; }
.svar { margin-top: 14px; font-size: 230px; line-height: 0.85; font-weight: 900; font-stretch: 125%; letter-spacing: -0.02em; }
.under { margin-top: 22px; font-size: 54px; font-weight: 800; font-stretch: 110%; }
.hoejre { background: #0D1B24; padding: 28px; display: flex; flex-direction: column; justify-content: flex-end; gap: 16px; }
.etiket { font-family: 'Plex Mono', monospace; font-weight: 600; font-size: 18px; color: #E8EDEF; letter-spacing: 0.06em; }
.soejler { display: flex; align-items: flex-end; gap: 3px; height: 380px; border-bottom: 2px solid #5C6D77; }
.soejler i { flex: 1; background: #5C6D77; }
.soejler i.v { background: #FFD400; }
.soejler i.n { background: #E8EDEF; }
</style>
</head>
<body>
<div class="kort">
  <div class="venstre">
    <div class="domaene">skaljegtaendemaskinen.fun</div>
    <div class="spoergsmaal">Skal jeg tænde <span>opvaskeren</span>?</div>
    <div class="svar">NEJ.</div>
    <div class="under">Vent til 02:45.</div>
  </div>
  <div class="hoejre">
    <div class="soejler" id="s"></div>
    <div class="etiket">I AFTEN OG I NAT · KR/KWH</div>
  </div>
</div>
<script>
// Nogenlunde rigtig form: dyrt kl. 17-21, billigt om natten
const p = [3.1,3.3,3.2,3.0,2.4,1.9,1.6,1.5,1.4,1.3,1.1,0.95,0.8,0.7,0.62,0.58,0.55,0.53,0.52,0.54,0.6,0.7,0.85,1.2,1.7,1.9,1.8,1.6];
const max = Math.max(...p);
p.forEach((v, i) => {
  const e = document.createElement('i');
  e.style.height = (v / max * 100) + '%';
  if (i === 0) e.className = 'n';
  else if (i >= 14 && i < 21) e.className = 'v';
  document.getElementById('s').append(e);
});
</script>
</body>
</html>
